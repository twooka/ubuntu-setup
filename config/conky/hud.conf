-- Left-side orrery (cairo) + fake shell.
-- Centred between screen-left and the right stats widget (460 px wide + 36 px gap):
-- shift = (460 + 36) / 2 = 248 px. If it lands too far right, use gap_x = -248.
conky.config = {
  out_to_x = true, out_to_wayland = false,
  own_window = true, own_window_type = 'normal', own_window_class = 'ConkyHUD',
  own_window_argb_visual = true, own_window_argb_value = 0, own_window_transparent = false,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  alignment = 'middle_middle', gap_x = 248, gap_y = 0,
  minimum_width = 960, maximum_width = 960,          -- = CW in orrery2.lua
  border_inner_margin = 0, border_outer_margin = 0,
  double_buffer = true, no_buffers = true,
  update_interval = 0.2,              -- 5 fps on AC (animation is time-based)
  update_interval_on_battery = 1.0,   -- 1 fps on battery
  text_buffer_size = 65536,
  use_xft = true, font = 'JetBrains Mono:size=9', draw_shades = false,
  default_color = '9fdfb0', color1 = '00ff66', color2 = '0b6e35', color3 = 'ffb000',
  lua_load = '/home/valebadda/.config/conky/orrery2.lua',
  lua_draw_hook_pre = 'draw',
}
-- voffset = CH (430) + room for the [ shell ] separator
conky.text = [[${voffset 446}${lua_parse shell}]]
